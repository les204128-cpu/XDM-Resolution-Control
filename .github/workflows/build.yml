name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: |
          unzip -q XDM_Resolution_Control_Source.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cd "$PROJECT"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XDM-Resolution-Control-APK
          path: output/app-debug.apk
